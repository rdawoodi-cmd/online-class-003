<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>پرتال کلاسی و ثبت حضور دانش‌آموزان</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --emerald: #059669;
            --bg: #f8fafc;
            --text: #0f172a;
            --card: #ffffff;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 480px; margin: auto; }
        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.08);
            border: 1px solid var(--border);
            margin-bottom: 14px;
        }
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { color: var(--primary); font-size: 1.2rem; margin: 0 0 6px 0; font-weight: 800; }
        .badge { font-size: 0.75rem; font-weight: bold; padding: 3px 10px; border-radius: 20px; display: inline-block; }
        .badge-ver { background: #dbeafe; color: #1e40af; }
        .time-box {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .time-box .time { font-family: monospace; font-size: 1.3rem; font-weight: 800; }
        .time-box .date { font-size: 0.8rem; opacity: 0.9; }

        label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 0.82rem; color: #334155; }
        input, select, textarea {
            width: 100%;
            padding: 11px 13px;
            margin-bottom: 14px;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
            font-family: 'Vazirmatn';
            font-size: 0.9rem;
            background: #fafafa;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-family: 'Vazirmatn';
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 0.92rem;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
        .btn-outline { background: #f8fafc; border: 1.5px solid var(--border); color: #475569; margin-top: 10px; font-size: 0.85rem; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(2px);
            z-index: 200;
            padding: 14px;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .assignment-item {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
        th, td { padding: 8px; text-align: right; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; color: #64748b; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <!-- Time Bar -->
    <div class="time-box">
        <div>
            <div style="font-size: 0.72rem; opacity: 0.85;">ساعت رسمی ایران:</div>
            <div id="iranClock" class="time">--:--:--</div>
        </div>
        <div style="text-align: left;">
            <div id="iranDate" class="date">در حال دریافت تاریخ...</div>
        </div>
    </div>

    <!-- Student Attendance Form -->
    <div class="card">
        <div class="header">
            <span class="badge badge-ver">پرتال کلاسی مدرسه</span>
            <h1>فرم حضور و غیاب کلاسی</h1>
        </div>

        <button class="btn" style="background: #eef2ff; color: #4338ca; border: 1.5px dashed #c7d2fe; margin-bottom: 16px;" onclick="openAssignmentsModal()">
            <i class="fa fa-book-open"></i> مشاهده تکالیف و نمرات کلاسی
        </button>

        <form id="attendanceForm" onsubmit="event.preventDefault(); submitAttendance();">
            <label for="classSelect"><i class="fa fa-graduation-cap"></i> کلاس دانش‌آموز:</label>
            <select id="classSelect" onchange="localStorage.setItem('eitaa_student_class', this.value)">
                <optgroup label="─── پایه هفتم ───">
                    <option value="هفتم الف">هفتم الف</option>
                    <option value="هفتم ب">هفتم ب</option>
                    <option value="هفتم ج">هفتم ج</option>
                    <option value="هفتم د">هفتم د</option>
                </optgroup>
                <optgroup label="─── پایه هشتم ───">
                    <option value="هشتم الف">هشتم الف</option>
                    <option value="هشتم ب">هشتم ب</option>
                    <option value="هشتم ج">هشتم ج</option>
                    <option value="هشتم د">هشتم د</option>
                </optgroup>
                <optgroup label="─── پایه نهم ───">
                    <option value="نهم الف">نهم الف</option>
                    <option value="نهم ب">نهم ب</option>
                    <option value="نهم ج">نهم ج</option>
                    <option value="نهم د">نهم د</option>
                </optgroup>
            </select>

            <label for="subjectSelect"><i class="fa fa-book"></i> درس مربوطه:</label>
            <select id="subjectSelect">
                <option value="فرهنگ و هنر">فرهنگ و هنر</option>
                <option value="ریاضی">ریاضی</option>
                <option value="علوم تجربی">علوم تجربی</option>
                <option value="ادبیات فارسی">ادبیات فارسی</option>
                <option value="زبان انگلیسی">زبان انگلیسی</option>
                <option value="پیام‌های آسمان و قرآن">پیام‌های آسمان و قرآن</option>
                <option value="مطالعات اجتماعی">مطالعات اجتماعی</option>
                <option value="کار و فناوری">کار و فناوری</option>
                <option value="عربی">عربی</option>
            </select>

            <label for="studentName"><i class="fa fa-user"></i> نام و نام خانوادگی دانش‌آموز:</label>
            <input type="text" id="studentName" placeholder="مثال: علی رضایی" required>

            <button type="submit" id="submitBtn" class="btn btn-primary">
                <i class="fa fa-check-circle"></i> ثبت نام در لیست حضور
            </button>
        </form>

        <button type="button" class="btn btn-outline" onclick="openLoginModal()">
            <i class="fa fa-chalkboard-teacher"></i> ورود به پنل دبیر
        </button>
    </div>
</div>

<!-- Assignments Modal -->
<div id="assignmentsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0; font-size:1rem; color:var(--primary);"><i class="fa fa-tasks"></i> تکالیف و نمرات</h3>
            <button onclick="closeModal('assignmentsModal')" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">&times;</button>
        </div>
        <div id="assignmentsList">
            <p style="text-align:center; color:#64748b; font-size:0.85rem;">در حال بارگذاری...</p>
        </div>
    </div>
</div>

<!-- Teacher Login Modal (Safe, No Prompt) -->
<div id="loginModal" class="modal">
    <div class="modal-content" style="max-width:360px; text-align:center;">
        <h3 style="margin-top:0; color:#1e293b;">ورود دبیر</h3>
        <p style="font-size:0.8rem; color:#64748b;">کد دسترسی دبیر را وارد نمایید:</p>
        <input type="password" id="teacherPass" placeholder="کد دبیر (پیش‌فرض: 1234)" style="text-align:center; letter-spacing:4px;">
        <button class="btn btn-primary" onclick="checkTeacherLogin()">تایید و ورود</button>
        <button class="btn btn-outline" onclick="closeModal('loginModal')">انصراف</button>
    </div>
</div>

<!-- Teacher Dashboard Modal -->
<div id="adminModal" class="modal">
    <div class="modal-content" style="max-width:600px;">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--primary); font-size:1rem;">پنل مدیریت دبیر</h3>
            <button onclick="closeModal('adminModal')" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">&times;</button>
        </div>
        <div style="max-height:350px; overflow-y:auto;">
            <table>
                <thead><tr><th>ردیف</th><th>نام دانش‌آموز</th><th>کلاس</th><th>درس</th><th>ساعت</th></tr></thead>
                <tbody id="adminAttendanceBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://dzbjznvdrrkfgycxqcnf.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Ymp6bnZkcnJrZmd5Y3hxY25mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY2Nzk3NDAsImV4cCI6MjA2MjI1NTc0MH0.SmsfK7s64U7k4hZ0rR-FfXFfLqK0wz1K8-8b-9-g_4U';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    function init() {
        const saved = localStorage.getItem('eitaa_student_class');
        if (saved) document.getElementById('classSelect').value = saved;
        updateClock();
        setInterval(updateClock, 1000);
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('iranClock').innerText = now.toLocaleTimeString('fa-IR', { timeZone: 'Asia/Tehran', hour12: false });
        document.getElementById('iranDate').innerText = now.toLocaleDateString('fa-IR', { timeZone: 'Asia/Tehran', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    async function submitAttendance() {
        const name = document.getElementById('studentName').value.trim();
        const cls = document.getElementById('classSelect').value;
        const sub = document.getElementById('subjectSelect').value;
        if (!name) return;

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> در حال ثبت...';

        try {
            await sb.from('attendance').insert([{
                student_name: name,
                class_name: cls,
                subject: sub,
                created_at: new Date().toISOString()
            }]);
            alert('حضور شما در کلاس با موفقیت ثبت شد ✅');
        } catch (e) {
            alert('ثبت گردید (ذخیره محلی)');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-check-circle"></i> ثبت نام در لیست حضور';
        }
    }

    async function openAssignmentsModal() {
        document.getElementById('assignmentsModal').style.display = 'flex';
        const list = document.getElementById('assignmentsList');
        const selectedClass = document.getElementById('classSelect').value;
        const stuName = document.getElementById('studentName').value.trim();

        try {
            const { data } = await sb.from('assignments').select('*').order('created_at', { ascending: false });
            if (!data || data.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#64748b; font-size:0.85rem;">هنوز تمرینی ارسال نشده است.</p>';
                return;
            }
            const filtered = data.filter(a => a.class_name === 'همه کلاس‌ها' || a.class_name === selectedClass);
            list.innerHTML = filtered.map(item => `
                <div class="assignment-item">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color:#1e3a8a;">${item.title}</strong>
                        <span class="badge badge-ver">${item.class_name}</span>
                    </div>
                    <p style="font-size:0.8rem; color:#475569; margin:6px 0;">${item.description || ''}</p>
                    <small style="color:#94a3b8; font-size:0.7rem;">درس: ${item.subject}</small>
                </div>
            `).join('');
        } catch (e) {
            list.innerHTML = '<p style="text-align:center; color:#e11d48; font-size:0.85rem;">خطا در دریافت لیست</p>';
        }
    }

    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function checkTeacherLogin() {
        const p = document.getElementById('teacherPass').value;
        if (p === '1234') {
            closeModal('loginModal');
            document.getElementById('adminModal').style.display = 'flex';
            loadAdminData();
        } else {
            alert('کد وارد شده صحیح نیست.');
        }
    }

    async function loadAdminData() {
        const tbody = document.getElementById('adminAttendanceBody');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">در حال بارگذاری...</td></tr>';
        const { data } = await sb.from('attendance').select('*').order('created_at', { ascending: false }).limit(50);
        if (data && data.length > 0) {
            tbody.innerHTML = data.map((r, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><b>${r.student_name}</b></td>
                    <td>${r.class_name || 'هفتم الف'}</td>
                    <td>${r.subject}</td>
                    <td dir="ltr">${new Date(r.created_at).toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'})}</td>
                </tr>
            `).join('');
        } else {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">داده‌ای ثبت نشده است.</td></tr>';
        }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    window.onload = init;
</script>
</body>
</html>
