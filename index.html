<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سامانه حضور و غیاب کلاس - نسخه 1.7</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://eitaa.com/widgets/eitaa-web-app.js"></script>
    <style>
        :root { --primary: #2563eb; --secondary: #1d4ed8; --bg: #f8fafc; --text: #0f172a; }
        body { font-family: 'Vazirmatn', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 440px; margin: auto; }
        .card { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(37,99,235,0.08); border: 1px solid #e2e8f0; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: var(--primary); font-size: 1.4rem; margin: 0 0 5px 0; }
        .version-badge { background: #dbeafe; color: #1e40af; font-size: 0.75rem; font-weight: bold; padding: 2px 10px; border-radius: 20px; display: inline-block; }
        .user-pill { background: #f1f5f9; padding: 8px 12px; border-radius: 12px; font-size: 0.8rem; color: #475569; margin-top: 10px; text-align: center; border: 1px solid #e2e8f0; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: #334155; }
        input, select { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 12px; border: 1.5px solid #cbd5e1; font-family: 'Vazirmatn'; font-size: 0.95rem; box-sizing: border-box; background: #fafafa; }
        input:focus, select:focus { border-color: var(--primary); outline: none; background: #fff; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-family: 'Vazirmatn'; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 1rem; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 4px 14px rgba(37,99,235,0.25); }
        .btn-admin { background: transparent; color: #64748b; font-size: 0.8rem; margin-top: 12px; }
        #adminView { display: none; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
        th, td { padding: 10px; text-align: right; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; color: #64748b; }
        .loader { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); place-items: center; z-index: 100; }
    </style>
</head>
<body>
<div id="loader" class="loader"><i class="fa fa-spinner fa-spin fa-2x" style="color:var(--primary)"></i></div>
<div class="container">
    <div id="studentView" class="card">
        <div class="header">
            <span class="version-badge">نسخه 1.7</span>
            <h1>ثبت حضور در کلاس</h1>
            <div id="eitaaInfo" class="user-pill">در حال شناسایی کاربر ایتا...</div>
        </div>
        <div class="form-group">
            <label><i class="fa fa-book"></i> انتخاب درس</label>
            <select id="sub"><option>فرهنگ و هنر</option><option>ریاضی</option></select>
        </div>
        <div class="form-group">
            <label><i class="fa fa-user"></i> نام و نام خانوادگی</label>
            <input type="text" id="stuName" placeholder="مثلاً: علی رضایی">
        </div>
        <button class="btn btn-primary" onclick="submitAttendance()">ثبت حضور در کلاس <i class="fa fa-check"></i></button>
        <button class="btn btn-admin" onclick="openAdmin()"><i class="fa fa-lock"></i> ورود به پنل دبیر</button>
    </div>

    <div id="adminView" class="card">
        <div class="header" style="display:flex; justify-content:space-between; align-items:center;">
            <button onclick="closeAdmin()" style="border:none; background:none; cursor:pointer;"><i class="fa fa-arrow-right"></i> بازگشت</button>
            <h2 style="margin:0; font-size:1.2rem; color:var(--primary);">لیست حضور و غیاب</h2>
            <div style="width:20px;"></div>
        </div>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr><th>نام</th><th>درس</th><th>زمان</th></tr></thead>
                <tbody id="adminTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://dzbjznvdrrkfgycxqcnf.supabase.co';
    const SB_KEY = 'sb_publishable_hLm2YZ48fzg-IC_u3BHVSw_PKPVEz0L';
    const sb = supabase.createClient(SB_URL, SB_KEY);
    let eitaaUser = { id: 'web', name: 'کاربر سیستم' };

    function initEitaa() {
        if (window.EitaaWebApp) {
            window.EitaaWebApp.expand();
            const u = window.EitaaWebApp.initDataUnsafe?.user;
            if (u) {
                eitaaUser.id = u.id;
                eitaaUser.name = (u.first_name || '') + ' ' + (u.last_name || '');
                document.getElementById('eitaaInfo').innerText = 'کاربر ایتا: ' + eitaaUser.name;
            } else {
                document.getElementById('eitaaInfo').innerText = 'اجرا در مرورگر وب';
            }
        }
    }

    async function submitAttendance() {
        const name = document.getElementById('stuName').value.trim();
        const sub = document.getElementById('sub').value;
        if (!name) return alert('لطفاً نام را وارد کنید');

        document.getElementById('loader').style.display = 'grid';
        const { error } = await sb.from('attendance').insert([{
            student_name: name,
            subject: sub,
            eitaa_user_id: String(eitaaUser.id),
            eitaa_name: eitaaUser.name
        }]);
        document.getElementById('loader').style.display = 'none';

        if (!error) {
            alert('حضور شما با موفقیت ثبت شد ✅');
            document.getElementById('stuName').value = '';
        } else {
            alert('خطا در ارتباط با دیتابیس: ' + error.message);
        }
    }

    async function openAdmin() {
        if (prompt('رمز دبیر (پیش‌فرض: 1234):') === '1234') {
            document.getElementById('studentView').style.display = 'none';
            document.getElementById('adminView').style.display = 'block';
            document.getElementById('loader').style.display = 'grid';
            const { data } = await sb.from('attendance').select('*').order('created_at', { ascending: false });
            document.getElementById('loader').style.display = 'none';
            if (data) {
                document.getElementById('adminTable').innerHTML = data.map(r => 
                    '<tr><td><b>' + r.student_name + '</b></td><td>' + r.subject + '</td><td dir="ltr">' + 
                    new Date(r.created_at).toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'}) + '</td></tr>'
                ).join('');
            }
        } else {
            alert('رمز اشتباه است!');
        }
    }

    function closeAdmin() {
        document.getElementById('adminView').style.display = 'none';
        document.getElementById('studentView').style.display = 'block';
    }

    window.onload = initEitaa;
</script>
</body>
</html>
